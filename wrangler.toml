# Cloudflare Pages project config. Static pages come from `astro build` (dist/);
# /functions deploys alongside as Pages Functions.
name = "turners-decks"
compatibility_date = "2026-10-01"
pages_build_output_dir = "./dist"

[[d1_databases]]
binding = "DB"
database_name = "turners-decks-leads"
# Replace with the id printed by: npx wrangler d1 create turners-decks-leads
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[vars]
NOTIFY_EMAIL = "turnersdecks@gmail.com"
# FROM_EMAIL needs a verified sending domain in Resend, e.g.
# FROM_EMAIL = "Turner's Decks <leads@turnersdecks.com>"
# Secrets (never commit these):
#   npx wrangler pages secret put AIRTABLE_TOKEN   (personal access token, scope data.records:write, base Turner's Decks only)
#   npx wrangler pages secret put RESEND_API_KEY
